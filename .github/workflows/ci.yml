name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lib-a:
    name: Build lib-a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @gh-actions/lib-a build
      - uses: actions/upload-artifact@v7
        with:
          name: lib-a-dist
          path: packages/lib-a/dist

  test-lib-a:
    name: Test lib-a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @gh-actions/lib-a test

  build-lib-b:
    name: Build lib-b
    needs: [build-lib-a]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: lib-a-dist
          path: packages/lib-a/dist
      - run: pnpm --filter @gh-actions/lib-b build
      - uses: actions/upload-artifact@v7
        with:
          name: lib-b-dist
          path: packages/lib-b/dist

  test-lib-b:
    name: Test lib-b
    needs: [build-lib-a]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: lib-a-dist
          path: packages/lib-a/dist
      - run: pnpm --filter @gh-actions/lib-b test

  test-app-a:
    name: Test app-a
    needs: [build-lib-a]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: lib-a-dist
          path: packages/lib-a/dist
      - run: pnpm --filter @gh-actions/app-a test

  test-app-a-visual:
    name: Test app-a visual
    needs: [build-lib-a]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: lib-a-dist
          path: packages/lib-a/dist
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-mono fonts-dejavu-core fonts-dejavu-mono
      - run: pnpm --filter @gh-actions/app-a exec playwright install --with-deps chromium
      - run: pnpm --filter @gh-actions/app-a test:visual
      - name: Upload visual report
        id: visual-report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-a-visual-report
          path: packages/app-a/.vitest
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Visual report link
        if: failure() && steps.visual-report.outputs.artifact-url
        run: echo "[Open visual report](https://viewer.vitest.dev/?url=${{ steps.visual-report.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  test-app-b:
    name: Test app-b
    needs: [build-lib-b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: lib-a-dist
          path: packages/lib-a/dist
      - uses: actions/download-artifact@v7
        with:
          name: lib-b-dist
          path: packages/lib-b/dist
      - run: pnpm --filter @gh-actions/app-b test
