name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lib-a:
    name: Build lib-a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @gh-actions/lib-a build
      - uses: actions/upload-artifact@v7
        with:
          name: lib-a-dist
          path: packages/lib-a/dist

  test-lib-a:
    name: Test lib-a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @gh-actions/lib-a test

  build-lib-b:
    name: Build lib-b
    needs: [build-lib-a]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: lib-a-dist
          path: packages/lib-a/dist
      - run: pnpm --filter @gh-actions/lib-b build
      - uses: actions/upload-artifact@v7
        with:
          name: lib-b-dist
          path: packages/lib-b/dist

  test-lib-b:
    name: Test lib-b
    needs: [build-lib-a]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: lib-a-dist
          path: packages/lib-a/dist
      - run: pnpm --filter @gh-actions/lib-b test

  test-app-a:
    name: Test app-a
    needs: [build-lib-a]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: lib-a-dist
          path: packages/lib-a/dist
      - run: pnpm --filter @gh-actions/app-a test

  test-app-a-visual:
    name: Test app-a visual
    needs: [build-lib-a]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: lib-a-dist
          path: packages/lib-a/dist
      - run: pnpm --filter @gh-actions/app-a exec playwright install --with-deps chromium
      - run: pnpm --filter @gh-actions/app-a test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: app-a-visual-diffs
          path: packages/app-a/.vitest/attachments
          if-no-files-found: ignore
      - if: failure()
        run: |
          {
            echo "### Visual mismatch"
            echo "Download the **app-a-visual-diffs** artifact from this run."
            echo "- \`*-diff-*.png\` — pink overlay of pixels that disagree"
            echo "- \`*-actual-*.png\` — what this runner captured"
            echo "- committed \`src/__screenshots__\` — the reference"
          } >> "$GITHUB_STEP_SUMMARY"

  test-app-b:
    name: Test app-b
    needs: [build-lib-b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: lib-a-dist
          path: packages/lib-a/dist
      - uses: actions/download-artifact@v7
        with:
          name: lib-b-dist
          path: packages/lib-b/dist
      - run: pnpm --filter @gh-actions/app-b test
