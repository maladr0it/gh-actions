name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hello:
    name: Hello
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo hello world
          exit 0

  ci:
    name: CI
    needs: hello
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
